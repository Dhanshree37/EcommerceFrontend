<div class="register-container">
  <mat-card class="register-card">
    <!-- LEFT SECTION -->
    <div class="left-section">
      <img src="assets/images/logos/Logo-noback.png" alt="logo" class="logo" />

      <h2 class="title">Create Your PawZone Account</h2>
      <p class="subtitle">
        Join us and discover premium products for your furry companions.
      </p>

      <img
        src="assets/svg/pet-register.svg"
        alt="Pet Illustration"
        class="illustration"
      />
    </div>

    <!-- RIGHT SECTION -->
    <div class="right-section">
      <form class="form" autocomplete="off">
        <!-- Full Name -->
        <mat-form-field appearance="outline"class="full-width">
          <mat-label>Full Name</mat-label>
          <input matInput type="text" required />
        </mat-form-field>

        <!-- Email -->
        <mat-form-field appearance="outline"class="full-width">
          <mat-label>Email Address</mat-label>
          <input matInput type="email" required />
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="outline"class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" required />
        </mat-form-field>

        <!-- Confirm Password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm Password</mat-label>
          <input matInput type="password" required />
        </mat-form-field>

        <!-- Create Account button -->
        <button mat-raised-button class="register-btn full-width">
          Create Account
        </button>

        <div class="divider">
          <span>or</span>
        </div>

        <!-- Google Sign Up -->
        <button mat-stroked-button class="google-btn full-width">
          <img src="assets/svg/google.svg" class="google-icon" />
          Sign up with Google
        </button>

        <!-- Already have account -->
        <p class="signup-text">
          Already have an account?
          <a routerLink="/auth/login">Log in</a>
        </p>
      </form>
    </div>
  </mat-card>
</div>
