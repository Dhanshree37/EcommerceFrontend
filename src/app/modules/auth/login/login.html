<div class="login-container">
  <mat-card class="login-card">

    <!-- LEFT SECTION -->
    <div class="left-section">
      <img src="assets/images/logos/Logo-noback.png" alt="logo" class="logo" />

      <h2 class="title">Welcome Back to PawZone</h2>
      <p class="subtitle">
        Login to continue exploring premium pet products.
      </p>

      <img src="assets/svg/pet-login.svg"
           alt="Pet Illustration"
           class="illustration" />
    </div>

    <!-- RIGHT SECTION -->
    <div class="right-section">
      <form class="form" autocomplete="off">

        <!-- Email -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email Address</mat-label>
          <input matInput type="email" required />
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" required />
        </mat-form-field>

        <!-- Forgot + Remember -->
        <div class="flex-row space-between">
          <a class="forgot-password">Forgot Password?</a>

          <mat-checkbox color="primary">Remember Me</mat-checkbox>
        </div>

        <!-- Login button -->
        <button mat-raised-button class="login-btn full-width">
          Log In
        </button>

        <div class="divider">
          <span>or</span>
        </div>

        <!-- Google login -->
        <button mat-stroked-button class="google-btn full-width">
          <img src="assets/svg/google.svg" class="google-icon" />
          Continue with Google
        </button>

        <p class="signup-text">
          Don’t have an account?
          <a routerLink="/auth/register">Sign up</a>
        </p>
      </form>
    </div>

  </mat-card>
</div>
