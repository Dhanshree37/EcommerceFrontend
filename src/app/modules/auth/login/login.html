<div class="login-container">
  <mat-card class="login-card">
    <!-- LEFT SECTION -->
    <div class="left-section">
      <img src="assets/images/logos/Logo-noback.png" alt="logo" class="logo" />

      <h2 class="title">Welcome Back to PawZone</h2>
      <p class="subtitle">Login to continue exploring premium pet products.</p>

      <img
        src="assets/svg/pet-login.svg"
        alt="Pet Illustration"
        class="illustration"
      />
    </div>

    <!-- RIGHT SECTION -->
    <div class="right-section">
      <form
        [formGroup]="loginForm"
        (ngSubmit)="onLogin()"
        class="form"
        autocomplete="off"
      >
        <!-- Email -->
        <mat-form-field
          appearance="outline"
          hideRequiredMarker="true"
          class="full-width"
        >
          <mat-label>Email Address</mat-label>

          <input
            matInput
            formControlName="email"
            type="email"
            autocomplete="username"
            aria-label="Email"
          />

          @if (showEmailError) {
          <mat-error>{{ emailError }}</mat-error>
          }
        </mat-form-field>

        <!-- Password -->
        <mat-form-field
          appearance="outline"
          hideRequiredMarker="true"
          class="full-width"
        >
          <mat-label>Password</mat-label>

          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
            aria-label="Password"
          />

          @if (showPasswordError) {
          <mat-error>{{ passwordError }}</mat-error>
          }
        </mat-form-field>

        <!-- Forgot + Remember -->
        <div class="flex-row space-between">
          <a class="forgot-password">Forgot Password?</a>
          <mat-checkbox formControlName="remember">Remember Me</mat-checkbox>
        </div>

        <!-- Login button -->
        <button
          mat-raised-button
          class="login-btn full-width"
          type="submit"
          [disabled]="loginForm.invalid || loading"
        >
          @if (!loading) { Log In }
          @if (loading) {
          <mat-spinner diameter="24"></mat-spinner>
          }
        </button>

        <div class="divider"><span>or</span></div>

        <!-- Google login -->
        <button mat-stroked-button type="button" class="google-btn full-width">
          <img src="assets/svg/google.svg" class="google-icon" />
          Continue with Google
        </button>

        <p class="signup-text">
          Don’t have an account?
          <a routerLink="/auth/register">Sign up</a>
        </p>
      </form>
    </div>
  </mat-card>
</div>
